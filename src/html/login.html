    <script src="/static/login.js"></script>


    <script>
        const loadingScreen = document.querySelector('.loading-screen');
        const content = document.querySelector('.content');
        const progress = document.querySelector('.progress');
        const progressText = document.querySelector('.progress-text');
        const loadingContainer = document.querySelector('.loading-container');
        const login = document.getElementById("login")

        // Create floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const translateX = (Math.random() - 0.5) * 100;
            particle.style.setProperty('--translateX', `${translateX}px`);
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animation = 'particleFloat 3s ease-in-out forwards';
            loadingContainer.appendChild(particle);

            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }

        // Generate particles periodically
        const particleInterval = setInterval(() => {
            createParticle();
        }, 300);

        // Simulate loading progress
        let currentProgress = 0;
        const interval = setInterval(() => {
            currentProgress += Math.random() * 12;
            if (currentProgress > 100) currentProgress = 100;

            progress.style.width = currentProgress + '%';
            progressText.textContent = Math.round(currentProgress) + '%';

            if (currentProgress === 100) {
                clearInterval(interval);
                clearInterval(particleInterval);
                setTimeout(hideLoadingScreen, 500);
            }
        }, 300);

        // Add mouse movement interaction
        document.addEventListener('mousemove', (e) => {
            if (loadingScreen.style.opacity !== '0') {
                const ring = document.querySelector('.loader-ring');
                const rect = ring.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const deltaX = (e.clientX - centerX) / 30;
                const deltaY = (e.clientY - centerY) / 30;

                ring.style.transform = `perspective(1000px) rotateX(${deltaY}deg) rotateY(${-deltaX}deg)`;
            }
        });
        function hideLoadingScreen() {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                login.style.display = 'flex';

            }, 800);
        }

        function refreshPage() {
            window.location.reload();
        }
    </script>
    <style>

        }
/* ERROR */

            transition: box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);

            user-select: none;
            width: 1em;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--background-start), var(--background-end));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--background-start), var(--background-end));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease-in-out;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            position: relative;
        }

        .loader-ring {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .loader-ring::before,
        .loader-ring::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--primary-color);
            animation: spin 2s linear infinite;
        }

        .loader-ring::after {
            border: 3px solid transparent;
            border-top-color: var(--secondary-color);
            animation: spin 1.5s linear infinite reverse;
        }

        .loader-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .progress-container {
            width: 240px;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s ease-out;
        }

        .progress-text {
            position: absolute;
            top: -25px;
            right: 0;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0.8;
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 2s linear infinite;
        }

        .content {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
            padding: 2rem;
        }

        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .refresh-btn {
            margin-top: 2rem;
            padding: 0.875rem 2rem;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent);
            transition: 0.5s;
        }

        .refresh-btn:hover::before {
            left: 100%;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100px) translateX(var(--translateX));
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .loader-ring {
                width: 120px;
                height: 120px;
            }

            .loader-core {
                width: 60px;
                height: 60px;
            }

            .progress-container {
                width: 200px;
            }

            .loading-text {
                font-size: 1rem;
            }

            .content h1 {
                font-size: 2rem;
            }
        }
    </style>

        .ring {

        .ring i {

            inset: 0;
            border: 2px solid #fff;

        .ring i:nth-child(1) {
            border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;

        }

        .ring i:nth-child(2) {
            border-radius: 41% 44% 56% 59%/38% 62% 63% 37%;
            animation: animate 4s linear infinite;

        .ring i:nth-child(3) {

        }

        .ring:hover i {
            border: 6px solid var(--clr);
            filter: drop-shadow(0 0 20px var(--clr));

        @keyframes animate {
            0% {
                transform: rotate(0deg);
